<form class="dialog defend-dialog">
  <div class="form-row">
    <label>{{localize 'FO.Defend'}} {{localize 'FO.DR'}}:</label>
    <div class="field-value">
      <input
      type="number"
      name="defense-base-dr"
      value="{{defendDR}}"
      placeholder="12"
      data-dtype="Number"
      />      
    </div>
  </div>
  <div class="form-row disabled">
    <label>{{localize 'FO.Modified'}} {{localize 'FO.DR'}}:</label>
    <div class="field-value">
      <input
      type="number"
      class="readonly"
      name="defense-modified-dr"
      value=""
      readonly
      />
    </div>
  </div>
  {{# if drModifiers}}
  <div class="form-row">
    <label>&nbsp;</label>
    <div class="field-value">
      ( {{#each drModifiers}} {{this}} {{#unless @last}},{{/unless}} {{/each}} )
    </div>
  </div>
  {{/if}}  
  <div class="form-row">
    <label>{{localize 'FO.IncomingAttack'}}:</label>
    <div class="field-value">
      <input
      type="text"
      name="incoming-attack"
      value="{{incomingAttack}}"
      placeholder="1d6"
      data-dtype="String"
      />      
    </div>
  </div>
  <div class="form-row">
    <label>{{localize 'FO.DamageDealtTo'}}:</label>
    <div class="field-value">
      <select name="damage-dealt-to">
        <option value="hit-points" {{#ifEq damageDealtTo "hit-points"}}selected{{/ifEq}}>{{localize 'FO.HitPoints'}}</option>
        <option value="stability-points" {{#ifEq damageDealtTo "stability-points"}}selected{{/ifEq}}>{{localize 'FO.StabilityPoints'}}</option>
      </select>
    </div>
  </div>
  <div class="button-row">
    <button class="dialog-button defend-button" type="button" name="Defend">{{ localize "FO.Defend" }}</button>
  </div>
</form>
