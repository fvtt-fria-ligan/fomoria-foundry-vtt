<form class="dialog attack-dialog">
  <input type="hidden" name="item-id" value="{{itemId}}" />
  <div class="form-group">
    <label>{{localize 'FO.Attack'}} {{localize 'FO.DR'}}</label>
    <div class="field-value">
      <input
        type="number"
        name="attack-base-dr"
        value="{{attackDR}}"
        placeholder="12"
        data-dtype="Number"
      />
    </div>
  </div>
  {{# if drModifiers}}
  <div class="dr-modifier">
    ( {{#each drModifiers}} {{this}} {{#unless @last}},{{/unless}} {{/each}} )
  </div>
  {{/if}}  
  <div class="form-group">
    <label>{{localize 'FO.Modified'}} {{localize 'FO.DR'}}:</label>
    <input
      type="text"
      class="readonly"
      name="attack-modified-dr"
      value=""
      placeholder="12"
      readonly
    />
  </div>  
  <div class="form-group">
    <label>{{localize 'FO.TargetArmor'}}:</label>
    <input
      type="text"
      name="target-armor"
      value="{{targetArmor}}"
      placeholder="1d2"
      data-dtype="String"
    />
  </div>
  <div class="button-row">
    <button class="dialog-button attack-button" type="submit" name="Attack">{{ localize "FO.Attack" }}</button>
  </div>
</form>
