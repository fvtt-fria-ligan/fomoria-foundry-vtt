<form class="custom-dialog">
  <input type="hidden" name="itemid" value="{{itemId}}" />
  <div class="form-group">
    <label>{{localize 'FO.Attack'}} {{localize 'FO.DR'}}:</label>
    <input
      type="text"
      name="attackbasedr"
      value="{{attackDR}}"
      placeholder="12"
      data-dtype="Number"
    />
  </div>
  <div class="form-group">
    <label>{{localize 'FO.Modified'}} {{localize 'FO.DR'}}:</label>
    <input
      type="text"
      class="readonly"
      name="attackmodifieddr"
      value=""
      placeholder="12"
      readonly
    />
  </div>  
  {{# if drModifiers}}
  <div class="dr-modifier">
    ( {{#each drModifiers}} {{this}} {{#unless @last}},{{/unless}} {{/each}} )
  </div>
  {{/if}}  
  <div class="form-group">
    <label>{{localize 'FO.TargetArmor'}}:</label>
    <input
      type="text"
      name="targetarmor"
      value="{{targetArmor}}"
      placeholder="1d2"
      data-dtype="String"
    />
  </div>
  <div class="button-row">
    <button class="dialog-button attack-button" type="submit" name="Attack">{{ localize "FO.Attack" }}</button>
  </div>
</form>
