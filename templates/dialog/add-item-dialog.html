
<form class="dialog add-item-dialog" action="">
  <div class="form-group">
    <label>{{ localize "FO.ItemName" }}</label>
    <input type="text" name="itemname" value="" placeholder="{{ localize 'FO.Name' }}" data-dtype="String"/>
  </div>
  <div class="form-group">
    <label>{{ localize "FO.ItemType" }}</label>
    <select class="add-type" name="itemtype"> 
      <option value="armor">{{ localize "FO.Armor" }}</option>
      <option value="boon">{{ localize "FO.Boon" }}</option>
      <option value="clan">{{ localize "FO.Clan" }}</option>
      <option value="condition">{{ localize "FO.Condition" }}</option>
      <option value="equipment" selected="selected">{{ localize "FO.Equipment" }}</option>
      <option value="expertise">{{ localize "FO.Expertise" }}</option>
      <option value="feat">{{ localize "FO.Feat" }}</option>
      <option value="folk">{{ localize "FO.Folk" }}</option>
      <option value="shield">{{ localize "FO.Shield" }}</option>
      <option value="tradition">{{ localize "FO.Tradition" }}</option>
      <option value="weapon">{{ localize "FO.Weapon" }}</option>
      <option value="weaponfeat">{{ localize "FO.WeaponFeat" }}</option>
    </select>
  </div>
  <div class="button-row">
    <button class="add-item-button" type="submit" name="add-item-button">{{ localize "FO.Add" }}</button>
  </div>
</form>
